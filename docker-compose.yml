services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-task-service:local
    container_name: devops-task-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "INFO"
      APP_ENV: "local"
      APP_VERSION: "0.1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
