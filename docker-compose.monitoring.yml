# Run together with the app:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
# Only Grafana is published to the host. Everything else stays on the internal app-net network.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # explicit metrics retention
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [app-net]

  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [app-net]

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # needed to discover containers and read their logs
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped
    networks: [app-net]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave   # read-only view of the host filesystem for disk/CPU/memory metrics
    restart: unless-stopped
    networks: [app-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro                 # host root, read-only
      - /var/run:/var/run:ro         # docker runtime socket dir
      - /sys:/sys:ro                 # cgroup data for container CPU/memory
      - /var/lib/docker/:/var/lib/docker:ro   # container metadata
      - /dev/disk/:/dev/disk:ro      # disk info
    restart: unless-stopped
    networks: [app-net]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"   # the only port published to the host
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped
    networks: [app-net]

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
