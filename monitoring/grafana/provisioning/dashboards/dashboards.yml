apiVersion: 1

providers:
  - name: devops-task          # name of this dashboard group
    orgId: 1
    folder: DevOps Task        # folder name shown inside Grafana
    type: file                 # load dashboards from JSON files
    disableDeletion: true      # dashboards cannot be deleted from the UI
    allowUiUpdates: false      # UI edits are not saved, the files in git are the source of truth
    updateIntervalSeconds: 30  # re-read the folder every 30 seconds
    options:
      path: /var/lib/grafana/dashboards   # folder inside the container, mounted from monitoring/grafana/dashboards
