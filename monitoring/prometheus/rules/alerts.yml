groups:
  - name: devops-task-alerts
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 1m   # scrape is 15s, so 1m = about 4 failed scrapes in a row, avoids one-off blips
        labels:
          severity: critical
        annotations:
          summary: "App instance {{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_errors_total[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m   # 5% of requests failing for 5 minutes is a real problem, not a short spike
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: HostDiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 80
        for: 10m   # disks fill slowly, 10m avoids noise while still leaving time to react
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is above 80% full"

      - alert: ContainerMemoryNearLimit
        expr: |
          (container_memory_working_set_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0)) * 100 > 90
        for: 5m   # above 90% of the limit for 5m means an OOM kill is likely soon
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is using more than 90% of its memory limit"
