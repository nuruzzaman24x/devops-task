auth_enabled: false   # single-tenant setup, no login needed inside the internal network

server:
  http_listen_port: 3100   # Loki API port, reachable only on the internal docker network

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki   # base folder for all Loki data
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1   # one copy, we run a single Loki
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h   # one index file per day, required for retention to work

limits_config:
  retention_period: 168h   # keep logs for 7 days, then delete them

compactor:
  working_directory: /loki/compactor
  retention_enabled: true   # the compactor is what actually deletes old logs
  delete_request_store: filesystem
